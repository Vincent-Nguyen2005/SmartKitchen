services:
  auth-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: auth_db }
    ports: ["5401:5432"]
    volumes: [auth-db-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"], interval: 5s, timeout: 5s, retries: 10 }
  auth-service:
    build: ./services/auth-service
    environment: { PORT: 4001, DATABASE_URL: postgresql://postgres:postgres@auth-db:5432/auth_db }
    ports: ["4001:4001"]
    depends_on: { auth-db: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4001/health || exit 1"], interval: 5s, timeout: 5s, retries: 10 }
