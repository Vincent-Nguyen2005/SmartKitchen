services:
  auth-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: auth_db }
    ports: ["5401:5432"]
    volumes: [auth-db-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"], interval: 5s, timeout: 5s, retries: 10 }
  auth-service:
    build: ./services/auth-service
    environment:
      PORT: 4001
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in the root .env file}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DATABASE_URL: postgresql://postgres:postgres@auth-db:5432/auth_db
    ports: ["4001:4001"]
    depends_on: { auth-db: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4001/health || exit 1"], interval: 5s, timeout: 5s, retries: 10 }
  family-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: family_db }
    ports: ["5402:5432"]
    volumes: [family-db-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d family_db"], interval: 5s, timeout: 5s, retries: 10 }
  family-service:
    build: ./services/family-service
    environment:
      PORT: 4002
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in the root .env file}
      AUTH_SERVICE_URL: http://auth-service:4001
      DATABASE_URL: postgresql://postgres:postgres@family-db:5432/family_db
    ports: ["4002:4002"]
    depends_on: { family-db: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4002/health || exit 1"], interval: 5s, timeout: 5s, retries: 10 }
  inventory-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: inventory_db }
    ports: ["5403:5432"]
    volumes: [inventory-db-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_db"], interval: 5s, timeout: 5s, retries: 10 }
  inventory-service:
    build: ./services/inventory-service
    environment:
      PORT: 4003
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@inventory-db:5432/inventory_db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      FAMILY_SERVICE_URL: http://family-service:4002
      PURCHASE_SYNC_API_KEY: ${PURCHASE_SYNC_API_KEY:?Set PURCHASE_SYNC_API_KEY in the root .env file}
      OPENFOODFACTS_USER_AGENT: "${OPENFOODFACTS_USER_AGENT:-SmartKitchen/1.0 (contact@example.com)}"
      TESSERACT_LANGUAGES: ${TESSERACT_LANGUAGES:-vie+eng}
      TESSERACT_LANG_PATH: ${TESSERACT_LANG_PATH:-}
      INVENTORY_UPLOAD_DIR: /data/uploads/inventory
      # Kho photo recognition: catalog labels from admin-service; Gemini only as fallback when CLIP is unsure (empty = off).
      ADMIN_SERVICE_URL: http://admin-service:4011
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    # Item photos; the image creates /data/uploads owned by USER node, which a new named volume inherits.
    volumes: [inventory-uploads:/data/uploads]
    ports: ["4003:4003"]
    depends_on:
      inventory-db: { condition: service_healthy }
      family-service: { condition: service_healthy }
    healthcheck: { test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4003/health || exit 1"], interval: 5s, timeout: 5s, retries: 10 }
  nutrition-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: nutrition_db }
    ports: ["5404:5432"]
    volumes: [nutrition-db-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d nutrition_db"], interval: 5s, timeout: 5s, retries: 10 }
  nutrition-service:
    build: ./services/nutrition-service
    # Daily stats read meal-diary-service; suggestions read recipe-service (request time only, no depends_on).
    # INTERNAL_API_KEY protects /internal/profiles (family menus; never exposed by the gateway).
    environment: { PORT: 4004, DATABASE_URL: postgresql://postgres:postgres@nutrition-db:5432/nutrition_db, MEAL_DIARY_SERVICE_URL: http://meal-diary-service:4005, RECIPE_SERVICE_URL: http://recipe-service:4006, INTERNAL_API_KEY: "${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in the root .env file}" }
    ports: ["4004:4004"]
    depends_on: { nutrition-db: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4004/health || exit 1"], interval: 5s, timeout: 5s, retries: 10 }
  meal-diary-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: meal_diary_db }
    ports: ["5405:5432"]
    volumes: [meal-diary-db-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d meal_diary_db"], interval: 5s, timeout: 5s, retries: 10 }
  meal-diary-service:
    build: ./services/meal-diary-service
    environment: { PORT: 4005, DATABASE_URL: postgresql://postgres:postgres@meal-diary-db:5432/meal_diary_db }
    ports: ["4005:4005"]
    depends_on: { meal-diary-db: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4005/health || exit 1"], interval: 5s, timeout: 5s, retries: 10 }
  recipe-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: recipe_db }
    ports: ["5406:5432"]
    volumes: [recipe-db-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d recipe_db"], interval: 5s, timeout: 5s, retries: 10 }
  recipe-service:
    build: ./services/recipe-service
    # Deleting a dish asks menu-service whether menus still use it (GET /internal/recipes/:id/usage, INTERNAL_API_KEY).
    environment: { PORT: 4006, DATABASE_URL: postgresql://postgres:postgres@recipe-db:5432/recipe_db, MENU_SERVICE_URL: http://menu-service:4007, INTERNAL_API_KEY: "${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in the root .env file}" }
    ports: ["4006:4006"]
    depends_on: { recipe-db: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4006/health || exit 1"], interval: 5s, timeout: 5s, retries: 10 }
  menu-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: menu_db }
    ports: ["5407:5432"]
    volumes: [menu-db-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d menu_db"], interval: 5s, timeout: 5s, retries: 10 }
  menu-service:
    build: ./services/menu-service
    environment:
      PORT: 4007
      DATABASE_URL: postgres://postgres:postgres@menu-db:5432/menu_db
      PAYMENT_SERVICE_URL: http://payment-service:4009
      # Kho suggestions read recipes and the family's Kho at request time (no depends_on, like nutrition).
      RECIPE_SERVICE_URL: http://recipe-service:4006
      INVENTORY_API_URL: http://inventory-service:4003
      FAMILY_SERVICE_URL: http://family-service:4002
      # Family health rules: members' allergies, conditions and meal targets (POST /internal/profiles).
      NUTRITION_SERVICE_URL: http://nutrition-service:4004
      # Family menus: the caller's family and the startup backfill come from family-service /internal/families/memberships.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in the root .env file}
      # AI dishes from Kho; empty = feature off. Values only in the root .env.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    ports: ["4007:4007"]
    depends_on: { menu-db: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4007/health || exit 1"], interval: 5s, timeout: 5s, retries: 10 }
  shopping-list-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: shopping_list_db }
    ports: ["5408:5432"]
    volumes: [shopping-list-db-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d shopping_list_db"], interval: 5s, timeout: 5s, retries: 10 }
  shopping-list-service:
    build: ./services/shopping-list-service
    environment:
      PORT: 4008
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@shopping-list-db:5432/shopping_list_db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      FAMILY_SERVICE_URL: http://family-service:4002
      INVENTORY_API_URL: http://inventory-service:4003
      MENU_SERVICE_URL: http://menu-service:4007
      PURCHASE_SYNC_API_KEY: ${PURCHASE_SYNC_API_KEY:?Set PURCHASE_SYNC_API_KEY in the root .env file}
      # admin-service asks GET /internal/products/:id/usage before deleting a catalog ingredient.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in the root .env file}
    ports: ["4008:4008"]
    depends_on:
      shopping-list-db: { condition: service_healthy }
      family-service: { condition: service_healthy }
      inventory-service: { condition: service_healthy }
      menu-service: { condition: service_healthy }
    healthcheck: { test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4008/health || exit 1"], interval: 5s, timeout: 5s, retries: 10 }
  payment-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: payment_db }
    ports: ["5409:5432"]
    volumes: [payment-db-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d payment_db"], interval: 5s, timeout: 5s, retries: 10 }
  payment-service:
    build: ./services/payment-service
    environment:
      PORT: 4009
      DATABASE_URL: postgres://postgres:postgres@payment-db:5432/payment_db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      PAYMENT_PUBLIC_BASE_URL: ${PAYMENT_PUBLIC_BASE_URL:-http://localhost:4000}
      PAYMENT_APP_RETURN_URL: ${PAYMENT_APP_RETURN_URL:-smartkitchen://payment-result}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PAYMENT_URL: ${VNPAY_PAYMENT_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-}
      MOMO_CREATE_URL: ${MOMO_CREATE_URL:-https://test-payment.momo.vn/v2/gateway/api/create}
    ports: ["4009:4009"]
    depends_on: { payment-db: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4009/health || exit 1"], interval: 5s, timeout: 5s, retries: 10 }
  notification-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: notification_db }
    ports: ["5410:5432"]
    volumes: [notification-db-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d notification_db"], interval: 5s, timeout: 5s, retries: 10 }
  notification-service:
    build: ./services/notification-service
    environment: { PORT: 4010, DATABASE_URL: postgresql://postgres:postgres@notification-db:5432/notification_db, PARTNER_API_KEY: replace-with-partner-key, INTERNAL_API_KEY: "${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in the root .env file}", PUSH_PROVIDER: mock, ENABLE_JOBS: "false", DEFAULT_TIMEZONE: Asia/Ho_Chi_Minh }
    ports: ["4010:4010"]
    depends_on: { notification-db: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4010/health || exit 1"], interval: 5s, timeout: 5s, retries: 10 }
  admin-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: admin_db }
    ports: ["5411:5432"]
    volumes: [admin-db-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d admin_db"], interval: 5s, timeout: 5s, retries: 10 }
  admin-service:
    build: ./services/admin-service
    environment:
      PORT: 4011
      DATABASE_URL: postgresql://postgres:postgres@admin-db:5432/admin_db
      ENABLE_JOBS: "true"
      HEALTH_POLL_INTERVAL_SECONDS: ${HEALTH_POLL_INTERVAL_SECONDS:-60}
      HEALTH_LOG_RETENTION_DAYS: 14
      AUTH_SERVICE_URL: http://auth-service:4001
      FAMILY_SERVICE_URL: http://family-service:4002
      INVENTORY_SERVICE_URL: http://inventory-service:4003
      NUTRITION_SERVICE_URL: http://nutrition-service:4004
      MEAL_DIARY_SERVICE_URL: http://meal-diary-service:4005
      RECIPE_SERVICE_URL: http://recipe-service:4006
      MENU_SERVICE_URL: http://menu-service:4007
      SHOPPING_LIST_SERVICE_URL: http://shopping-list-service:4008
      PAYMENT_SERVICE_URL: http://payment-service:4009
      NOTIFICATION_SERVICE_URL: http://notification-service:4010
      ADMIN_SERVICE_URL: http://admin-service:4011
      GATEWAY_URL: http://gateway:4000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in the root .env file}
      REPORT_RATE_LIMIT_PER_HOUR: ${REPORT_RATE_LIMIT_PER_HOUR:-5}
    ports: ["127.0.0.1:4011:4011"]
    depends_on: { admin-db: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4011/health || exit 1"], interval: 5s, timeout: 5s, retries: 10 }
  gateway:
    build: ./apps/gateway
    environment:
      PORT: 4000
      AUTH_SERVICE_URL: http://auth-service:4001
      FAMILY_SERVICE_URL: http://family-service:4002
      INVENTORY_SERVICE_URL: http://inventory-service:4003
      NUTRITION_SERVICE_URL: http://nutrition-service:4004
      MEAL_DIARY_SERVICE_URL: http://meal-diary-service:4005
      RECIPE_SERVICE_URL: http://recipe-service:4006
      MENU_SERVICE_URL: http://menu-service:4007
      SHOPPING_LIST_SERVICE_URL: http://shopping-list-service:4008
      PAYMENT_SERVICE_URL: http://payment-service:4009
      NOTIFICATION_SERVICE_URL: http://notification-service:4010
      ADMIN_SERVICE_URL: http://admin-service:4011
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 100
      AUTH_RATE_LIMIT_MAX: 20
      CACHE_TTL_SECONDS: 30
      CACHE_MAX_ITEMS: 100
      TRUST_PROXY: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
    ports: ["4000:4000"]
    healthcheck: { test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4000/health || exit 1"], interval: 5s, timeout: 5s, retries: 10 }
volumes:
  auth-db-data:
  family-db-data:
  inventory-db-data:
  inventory-uploads:
  nutrition-db-data:
  meal-diary-db-data:
  recipe-db-data:
  menu-db-data:
  shopping-list-db-data:
  payment-db-data:
  notification-db-data:
  admin-db-data:
