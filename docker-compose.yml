  admin-service:
    build: ./services/admin-service
    env_file: ./services/admin-service/.env
    ports:
      - "4011:4011"
    depends_on:
      - admin-service-db
  gateway:
    build: ./apps/gateway
    env_file: ./apps/gateway/.env
    ports:
      - "4000:4000"
    depends_on:
      - auth-service
      - family-service
      - inventory-service
      - nutrition-service
      - meal-diary-service
      - recipe-service
      - menu-service
      - shopping-list-service
      - payment-service
      - notification-service
      - admin-service

volumes:
  auth-service-db_data:
  family-service-db_data:
  inventory-service-db_data:
  nutrition-service-db_data:
  meal-diary-service-db_data:
  recipe-service-db_data:
  menu-service-db_data:
  shopping-list-service-db_data:
  payment-service-db_data:
  notification-service-db_data:
  admin-service-db_data:

