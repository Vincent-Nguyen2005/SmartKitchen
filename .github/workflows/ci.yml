name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-build:
    name: CI / lint-build (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - gateway
          - auth-service
          - family-service
          - inventory-service
          - nutrition-service
          - meal-diary-service
          - recipe-service
          - menu-service
          - shopping-list-service
          - payment-service
          - notification-service
          - admin-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client when present
        run: pnpm --filter "${{ matrix.package }}" run prisma:generate --if-present
      - name: Lint
        run: pnpm turbo run lint --filter="${{ matrix.package }}"
      - name: Build
        run: pnpm turbo run build --filter="${{ matrix.package }}"

  ci-success:
    name: CI / ci-success
    if: always()
    needs: [lint-build]
    runs-on: ubuntu-latest
    steps:
      - name: Require matrix success
        if: needs.lint-build.result != 'success'
        run: exit 1
      - name: CI passed
        run: echo "All workspace lint and build checks passed."
