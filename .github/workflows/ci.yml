name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-build:
    name: CI / lint-build (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: gateway
            prisma_schema: ""
            run_tests: true
          - package: auth-service
            prisma_schema: services/auth-service/prisma/schema.prisma
            run_tests: true
          - package: family-service
            prisma_schema: services/family-service/prisma/schema.prisma
            run_tests: true
          - package: inventory-service
            prisma_schema: services/inventory-service/prisma/schema.prisma
          - package: nutrition-service
            prisma_schema: services/nutrition-service/prisma/schema.prisma
          - package: meal-diary-service
            prisma_schema: services/meal-diary-service/prisma/schema.prisma
          - package: recipe-service
            prisma_schema: services/recipe-service/prisma/schema.prisma
          - package: menu-service
            prisma_schema: services/menu-service/prisma/schema.prisma
          - package: shopping-list-service
            prisma_schema: services/shopping-list-service/prisma/schema.prisma
          - package: payment-service
            prisma_schema: "" # chưa có model, bật lại khi owner thêm schema
          - package: notification-service
            prisma_schema: services/notification-service/prisma/schema.prisma
            run_tests: true
          - package: admin-service
            prisma_schema: services/admin-service/prisma/schema.prisma
            run_tests: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client when present
        if: hashFiles(matrix.prisma_schema) != ''
        run: pnpm --filter "${{ matrix.package }}" run prisma:generate
      - name: Lint
        run: pnpm turbo run lint --filter="${{ matrix.package }}"
      - name: Build
        run: pnpm turbo run build --filter="${{ matrix.package }}"
      - name: Test with coverage
        if: matrix.run_tests == true
        run: pnpm turbo run test:coverage --filter="${{ matrix.package }}"
      - name: Test inventory, shopping list, recipe and menu
        if: matrix.package == 'inventory-service' || matrix.package == 'shopping-list-service' || matrix.package == 'recipe-service' || matrix.package == 'menu-service'
        run: pnpm turbo run test --filter="${{ matrix.package }}"

  mobile-typecheck:
    name: CI / mobile-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check mobile app
        run: pnpm --filter mobile typecheck

  infra-check:
    name: CI / infra-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Route table, env examples, CI matrix and Prisma rules
        run: node scripts/check-infra.mjs

  ci-success:
    name: CI / ci-success
    if: always()
    needs: [lint-build, mobile-typecheck, infra-check]
    runs-on: ubuntu-latest
    steps:
      - name: Require matrix success
        if: needs.lint-build.result != 'success' || needs.mobile-typecheck.result != 'success' || needs.infra-check.result != 'success'
        run: exit 1
      - name: CI passed
        run: echo "All workspace lint, build, test, mobile type-check and infrastructure checks passed."
