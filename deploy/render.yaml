# SmartKitchen — Render Blueprint (stage 1). See docs/deploy/decision.md and docs/deploy/checklist.md.
#
# Render reads render.yaml from the repo root by default. This file lives in deploy/, so when creating the
# Blueprint set "Blueprint Path" to deploy/render.yaml.
#
# Rules this file enforces:
# - Only the gateway is public (type: web). Every backend is a private service (type: pserv) reachable only on
#   Render's private network, because backends trust x-user-id / x-user-role set by the gateway.
# - Database-per-service: one managed PostgreSQL per Prisma service; ipAllowList: [] = no public access.
# - Secrets are never in this file: generateValue (Render creates a random value) or sync: false (set by hand
#   in the dashboard).
# - Docker builds use the per-service context (same as docker-compose); Dockerfiles are npm-only and do not
#   need the monorepo root.
# - Prisma services run `prisma migrate deploy` on start (see each Dockerfile CMD); never migrate dev / db push.

envVarGroups:
  # Shared by auth-service (signs) and the gateway (verifies, HS256). Render generates a random 256-bit value.
  - name: smartkitchen-jwt
    envVars:
      - key: JWT_SECRET
        generateValue: true
  # Shared by admin-service (caller) and notification-service (POST /internal/notifications).
  - name: smartkitchen-internal
    envVars:
      - key: INTERNAL_API_KEY
        generateValue: true

services:
  # ---------------------------------------------------------------- public entry point
  - type: web
    name: smartkitchen-gateway
    runtime: docker
    plan: starter
    region: singapore
    branch: main
    autoDeployTrigger: checksPass # deploy main only after GitHub checks (CI / ci-success) pass
    dockerContext: ./apps/gateway
    dockerfilePath: ./apps/gateway/Dockerfile
    healthCheckPath: /health
    envVars:
      - fromGroup: smartkitchen-jwt
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY # exactly one proxy hop (Render's load balancer) in front of the gateway
        value: "true"
      - key: CORS_ORIGINS # comma-separated real origins, e.g. https://app.smartkitchen.vn — never * in production
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "120"
      - key: AUTH_RATE_LIMIT_MAX
        value: "20"
      - key: CACHE_TTL_SECONDS
        value: "30"
      - key: CACHE_MAX_ITEMS
        value: "500"
      - key: AUTH_SERVICE_URL
        fromService: { type: pserv, name: smartkitchen-auth, property: hostport }
      - key: NOTIFICATION_SERVICE_URL
        fromService: { type: pserv, name: smartkitchen-notification, property: hostport }
      - key: ADMIN_SERVICE_URL
        fromService: { type: pserv, name: smartkitchen-admin, property: hostport }
      # Stage 2: uncomment as each service gets real endpoints (and add its pserv + database below).
      # Until then those gateway routes answer 503 SERVICE_UNAVAILABLE.
      # - key: FAMILY_SERVICE_URL
      #   fromService: { type: pserv, name: smartkitchen-family, property: hostport }

  # ---------------------------------------------------------------- private services (stage 1)
  - type: pserv
    name: smartkitchen-auth
    runtime: docker
    plan: starter
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    dockerContext: ./services/auth-service
    dockerfilePath: ./services/auth-service/Dockerfile
    envVars:
      - fromGroup: smartkitchen-jwt
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4001"
      - key: DATABASE_URL
        fromDatabase: { name: smartkitchen-auth-db, property: connectionString }
      - key: CORS_ORIGIN
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: pserv
    name: smartkitchen-notification
    runtime: docker
    plan: starter
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    numInstances: 1 # ENABLE_JOBS=true must run on exactly one instance (07:00 morning push)
    dockerContext: ./services/notification-service
    dockerfilePath: ./services/notification-service/Dockerfile
    envVars:
      - fromGroup: smartkitchen-internal
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4010"
      - key: DATABASE_URL
        fromDatabase: { name: smartkitchen-notification-db, property: connectionString }
      - key: PARTNER_API_KEY # given to supermarket partners; rotate per docs/deploy/checklist.md
        generateValue: true
      - key: PUSH_PROVIDER
        value: expo
      - key: EXPO_ACCESS_TOKEN
        sync: false
      - key: ENABLE_JOBS
        value: "true"
      - key: DEFAULT_TIMEZONE
        value: Asia/Ho_Chi_Minh
      # Stage 2 (menu-service deployed): the 07:00 push lists today's breakfast. Until then it is greeting-only.
      # - key: MENU_SERVICE_URL
      #   fromService: { type: pserv, name: smartkitchen-menu, property: hostport }

  - type: pserv
    name: smartkitchen-admin
    runtime: docker
    plan: starter
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    numInstances: 1 # ENABLE_JOBS=true (health poller + retention) must run on exactly one instance
    dockerContext: ./services/admin-service
    dockerfilePath: ./services/admin-service/Dockerfile
    envVars:
      - fromGroup: smartkitchen-internal
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4011"
      - key: DATABASE_URL
        fromDatabase: { name: smartkitchen-admin-db, property: connectionString }
      - key: ENABLE_JOBS
        value: "true"
      - key: HEALTH_POLL_INTERVAL_SECONDS
        value: "120"
      - key: HEALTH_LOG_RETENTION_DAYS
        value: "14"
      - key: REPORT_RATE_LIMIT_PER_HOUR
        value: "5"
      - key: NOTIFICATION_SERVICE_URL
        fromService: { type: pserv, name: smartkitchen-notification, property: hostport }
      - key: AUTH_SERVICE_URL
        fromService: { type: pserv, name: smartkitchen-auth, property: hostport }
      - key: ADMIN_SERVICE_URL
        fromService: { type: pserv, name: smartkitchen-admin, property: hostport }
      - key: GATEWAY_URL
        fromService: { type: web, name: smartkitchen-gateway, property: hostport }
      # Stage-2 services are polled at their localhost defaults until their URLs are added, so they show
      # DOWN on the health dashboard (no audit spam: a first DOWN observation is not a transition).

  # ---------------------------------------------------------------- stage 2 (template, keep commented)
  # - type: pserv
  #   name: smartkitchen-family
  #   runtime: docker
  #   plan: starter
  #   region: singapore
  #   branch: main
  #   autoDeployTrigger: checksPass
  #   dockerContext: ./services/family-service
  #   dockerfilePath: ./services/family-service/Dockerfile
  #   envVars:
  #     - fromGroup: smartkitchen-jwt
  #     - key: NODE_ENV
  #       value: production
  #     - key: PORT
  #       value: "4002"
  #     - key: DATABASE_URL
  #       fromDatabase: { name: smartkitchen-family-db, property: connectionString }

databases:
  - name: smartkitchen-auth-db
    databaseName: auth_db
    user: auth
    plan: basic-256mb
    region: singapore
    ipAllowList: [] # private network only
  - name: smartkitchen-notification-db
    databaseName: notification_db
    user: notification
    plan: basic-256mb
    region: singapore
    ipAllowList: []
  - name: smartkitchen-admin-db
    databaseName: admin_db
    user: admin
    plan: basic-256mb
    region: singapore
    ipAllowList: []
  # Stage 2:
  # - name: smartkitchen-family-db
  #   databaseName: family_db
  #   user: family
  #   plan: basic-256mb
  #   region: singapore
  #   ipAllowList: []
