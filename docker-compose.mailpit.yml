# Local development only. Messages stay in Mailpit; they are NOT delivered to real inboxes.
services:
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports: ["127.0.0.1:8025:8025"]
  auth-service:
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASS: ""
      EMAIL_FROM: SmartKitchen Test <no-reply@smartkitchen.test>
    depends_on:
      mailpit: { condition: service_started }
